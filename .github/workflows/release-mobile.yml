name: Build Mobile Apps (Capacitor)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.3)'
        required: true
        type: string

# Allow write permissions for creating/updating releases
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Android: produce a SIGNED, sideload-installable release APK + an AAB.
  #
  # Capacitor's generated release buildType has no signing config, so an
  # unmodified `assembleRelease` yields app-release-unsigned.apk which Android
  # refuses to install. We generate an ephemeral keystore in CI and inject a
  # signingConfig (scripts/android_inject_signing.cjs) so the artifacts are
  # installable. The signing identity is per-build (not a stable Play Store
  # identity) which is appropriate for direct-download / preview distribution.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (signed APK + AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # Recursive submodule init fails on the broken/circular nested vendored
      # submodules upstream; the mobile app is a pure webview and needs none of
      # the Python backend, so initialize nothing extra.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${RAW#v}"
          # Derive a monotonic integer versionCode from semver major.minor.patch.
          IFS='.' read -r MA MI PA <<< "${VERSION%%-*}"
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          CODE=$(( MA * 1000000 + MI * 1000 + PA ))
          [ "$CODE" -gt 0 ] || CODE=1
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Resolved version=$VERSION versionCode=$CODE"

      - name: Install dependencies
        env:
          SKIP_SUBMODULE_INSTALL: 'true'
        run: |
          npm ci || npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize UI submodules (SwissKnife + ipfs_kit_py JS SDK)
        run: |
          # Top-level (non-recursive) init only: pulls swissknife/web (the
          # SwissKnife desktop UI) and ipfs_kit_py (the browser JS MCP SDK lives
          # in a plain dir inside it). Avoid --recursive: the nested vendored
          # submodules upstream are broken and would fail the checkout.
          git submodule update --init --depth 1 swissknife ipfs_kit_py \
            || git submodule update --init swissknife ipfs_kit_py \
            || echo "WARNING: submodule init failed; build will proceed without SwissKnife/JS-SDK"

      - name: Build web assets
        run: npm run build:web

      - name: Add & sync Capacitor Android
        run: |
          npx cap add android || echo "android platform already added"
          npx cap sync android

      - name: Generate ephemeral signing keystore
        id: keystore
        shell: bash
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          PASS="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
          keytool -genkeypair -v \
            -keystore "$KS" \
            -alias hallucinate \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Hallucinate App, OU=Engineering, O=Endomorphosis, L=NA, ST=NA, C=US"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=hallucinate" >> $GITHUB_ENV
          echo "::add-mask::$PASS"
          echo "ANDROID_KEYSTORE_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$PASS" >> $GITHUB_ENV

      - name: Inject signing config & version into Gradle
        env:
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: node scripts/android_inject_signing.cjs

      - name: Build signed APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect & rename artifacts
        id: collect
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT="$GITHUB_WORKSPACE/mobile-out"
          mkdir -p "$OUT"
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)
          [ -n "$APK" ] || APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          if [ -n "$APK" ]; then cp "$APK" "$OUT/hallucinate-app-${V}-android.apk"; fi
          if [ -n "$AAB" ]; then cp "$AAB" "$OUT/hallucinate-app-${V}-android.aab"; fi
          echo "=== mobile-out ==="; ls -la "$OUT"
          # Verify the APK is actually signed.
          if [ -n "$APK" ]; then
            "$ANDROID_SDK_ROOT"/build-tools/*/apksigner verify --verbose "$APK" || \
              echo "WARNING: apksigner verification reported an issue"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: mobile-out/*
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS: best-effort UNSIGNED archive. Without Apple Developer signing
  # certificates (not available as repo secrets) we cannot produce an
  # installable .ipa, but we can produce an unsigned archive that a developer
  # with their own certificate can re-sign and export. This job is allowed to
  # fail without blocking the Android release (see create-mobile-release's
  # if: always()).
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (unsigned archive, best-effort)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${RAW#v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        env:
          SKIP_SUBMODULE_INSTALL: 'true'
        run: |
          npm ci || npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Initialize UI submodules (SwissKnife + ipfs_kit_py JS SDK)
        run: |
          git submodule update --init --depth 1 swissknife ipfs_kit_py \
            || git submodule update --init swissknife ipfs_kit_py \
            || echo "WARNING: submodule init failed; build will proceed without SwissKnife/JS-SDK"

      - name: Build web assets
        run: npm run build:web

      - name: Add & sync Capacitor iOS
        run: |
          npx cap add ios || echo "ios platform already added"
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build unsigned archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath "$RUNNER_TEMP/App.xcarchive" \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGN_ENTITLEMENTS="" \
                     DEVELOPMENT_TEAM=""

      - name: Package archive
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT="$GITHUB_WORKSPACE/mobile-out"
          mkdir -p "$OUT"
          cd "$RUNNER_TEMP"
          zip -ry "$OUT/hallucinate-app-${V}-ios-unsigned.xcarchive.zip" App.xcarchive
          ls -la "$OUT"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: mobile-out/*
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Publish whatever built onto the existing version release. Runs even if iOS
  # (or, defensively, Android) failed, so a partial set still ships.
  # ---------------------------------------------------------------------------
  create-mobile-release:
    name: Publish mobile artifacts
    needs: [build-android, build-ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=v${RAW#v}" >> $GITHUB_OUTPUT
          echo "version=${RAW#v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: mobile-artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded mobile artifacts ==="
          find mobile-artifacts -type f -exec ls -la {} \; || true

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          FILES=$(find mobile-artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" \))
          if [ -z "$FILES" ]; then
            echo "No mobile artifacts were produced; nothing to publish."
            exit 0
          fi
          # Ensure the release exists (the desktop workflow normally creates it;
          # create it here if mobile happens to run first or stands alone).
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Release $TAG" \
              --notes "Automated release $TAG (mobile artifacts)."
          fi
          echo "Uploading:"; echo "$FILES"
          gh release upload "$TAG" $FILES -R "$GITHUB_REPOSITORY" --clobber

      - name: Summary
        shell: bash
        run: |
          {
            echo "# Mobile Release Summary"
            echo ""
            echo "Version: ${{ steps.ver.outputs.version }}"
            echo ""
            echo "## Artifacts"
            find mobile-artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" \) | while read -r f; do
              echo "- $(basename "$f") ($(du -h "$f" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"
