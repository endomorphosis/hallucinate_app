name: Build Mobile Apps (Capacitor)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.4)'
        required: true
        type: string

# Allow write permissions for creating releases
permissions:
  contents: write

jobs:
  # Build iOS app
  build-ios:
    name: Build iOS (${{ matrix.arch }})
    runs-on: macos-14  # macOS with Apple Silicon for faster builds
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            scheme: App
            sdk: iphoneos
          - arch: x86_64
            scheme: App
            sdk: iphonesimulator
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          npm ci || npm install
      
      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      
      - name: Build web assets
        run: |
          npm run build:web
      
      - name: Initialize Capacitor iOS
        run: |
          npx cap add ios || echo "iOS platform already added"
      
      - name: Sync Capacitor
        run: |
          npx cap sync ios
      
      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install
      
      - name: Build iOS app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -sdk ${{ matrix.sdk }} \
                     -configuration Release \
                     -archivePath App-${{ matrix.arch }}.xcarchive \
                     archive
      
      - name: Export IPA (device builds only)
        if: matrix.sdk == 'iphoneos'
        run: |
          cd ios/App
          # Create export options plist
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>YOUR_TEAM_ID</string>
            <key>uploadSymbols</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          
          # Note: Actual export requires proper code signing
          # This is a placeholder for the export step
          echo "IPA export requires code signing certificates"
      
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.arch }}
          path: |
            ios/App/App-${{ matrix.arch }}.xcarchive
          retention-days: 7
          if-no-files-found: warn
  
  # Build Android app
  build-android:
    name: Build Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            gradle_arch: arm64-v8a
          - arch: armeabi-v7a
            gradle_arch: armeabi-v7a
          - arch: x86_64
            gradle_arch: x86_64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install dependencies
        run: |
          npm ci || npm install
      
      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android
      
      - name: Build web assets
        run: |
          npm run build:web
      
      - name: Initialize Capacitor Android
        run: |
          npx cap add android || echo "Android platform already added"
      
      - name: Sync Capacitor
        run: |
          npx cap sync android
      
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          ANDROID_ABI: ${{ matrix.gradle_arch }}
      
      - name: Build Android AAB (for Play Store)
        run: |
          cd android
          ./gradlew bundleRelease
        env:
          ANDROID_ABI: ${{ matrix.gradle_arch }}
      
      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ matrix.arch }}
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload Android AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ matrix.arch }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
          if-no-files-found: error
  
  # Create GitHub Release with mobile artifacts
  create-mobile-release:
    name: Create Mobile Release
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: mobile-artifacts
      
      - name: List all artifacts
        run: |
          echo "=== Downloaded mobile artifacts ==="
          ls -laR mobile-artifacts/
      
      - name: Generate release notes
        id: release_notes
        run: |
          # Extract version from tag or input
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # Create release notes
          cat > release_notes.md << 'EOF'
          ## Hallucinate App Mobile ${VERSION}
          
          ### 📱 Mobile Downloads
          
          This release includes mobile apps for iOS and Android built with Capacitor.
          
          #### iOS
          - **iOS ARM64 (iPhone/iPad)**: `hallucinate-app-ios-arm64.xcarchive.zip`
          - **iOS Simulator (x86_64)**: `hallucinate-app-ios-simulator.xcarchive.zip`
          
          > **Note**: iOS apps require code signing. The provided archives need to be signed with your Apple Developer certificate before installation.
          
          #### Android
          - **Android ARM64-v8a**: `hallucinate-app-android-arm64-v8a.apk`
          - **Android ARMv7a**: `hallucinate-app-android-armeabi-v7a.apk`
          - **Android x86_64**: `hallucinate-app-android-x86_64.apk`
          - **Play Store Bundle (ARM64)**: `hallucinate-app-android-arm64-v8a.aab`
          
          ### 🚀 Installation
          
          **iOS:**
          1. Unzip the `.xcarchive.zip` file
          2. Sign with your Apple Developer certificate
          3. Export as IPA
          4. Install via Xcode or TestFlight
          
          **Android:**
          1. Download the appropriate APK for your device
          2. Enable "Install from Unknown Sources" in Settings
          3. Install the APK
          
          **Android Play Store:**
          1. Use the AAB file for Play Store submission
          
          ### 🌟 Features
          
          - WebNN/WebGPU hardware acceleration support
          - ONNX model inference in browser
          - Model collection viewer
          - Experimental features (Gradio Lite, Jupyter Lite, Streamlit Lite)
          - Error monitoring dashboard
          
          ### 📋 Requirements
          
          **iOS:**
          - iOS 14.0 or later
          - iOS 18+ recommended for WebGPU support
          
          **Android:**
          - Android 8.0 (API 26) or later
          - Android 13+ recommended for WebGPU support
          - Vulkan-capable device for WebGPU
          
          ### What's Changed
          
          EOF
          
          # Add recent commits as changelog if this is a tag push
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "#### Recent Changes" >> release_notes.md
            git log --pretty=format:"- %s (%h)" -10 >> release_notes.md
          fi
          
          cat release_notes.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_notes.outputs.VERSION }}-mobile
          name: Mobile Release ${{ steps.release_notes.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: true
          files: |
            mobile-artifacts/**/*.apk
            mobile-artifacts/**/*.aab
            mobile-artifacts/**/*.xcarchive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release Summary
        run: |
          echo "# Mobile Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Version: ${{ steps.release_notes.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Published Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cd mobile-artifacts
          for dir in */; do
            echo "### ${dir%/}" >> $GITHUB_STEP_SUMMARY
            find "$dir" -type f | while read file; do
              size=$(du -h "$file" | cut -f1)
              echo "- $(basename "$file") ($size)" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          done
