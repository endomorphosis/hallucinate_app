name: Release Electron Apps to GitHub

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.3)'
        required: true
        type: string

# Allow write permissions for creating releases
permissions:
  contents: write

jobs:
  # Build and publish for all platform/architecture combinations
  build-release:
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - os: windows
            arch: x64
            runner: windows-latest
            platform: win32
            makers: squirrel
          - os: windows
            arch: arm64
            runner: windows-latest
            platform: win32
            makers: squirrel
          
          # macOS builds (Intel)
          - os: macos
            arch: x64
            runner: macos-13
            platform: darwin
            makers: dmg,zip
          
          # macOS builds (Apple Silicon)
          - os: macos
            arch: arm64
            runner: macos-14
            platform: darwin
            makers: dmg,zip
          
          # Linux x64 builds
          - os: linux
            arch: x64
            runner: ubuntu-latest
            platform: linux
            makers: deb,rpm,zip
          
          # Linux ARM64 builds
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            platform: linux
            makers: deb,rpm,zip
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # Initialize only the top-level backend submodules. Recursive init is
      # avoided because the upstream repos contain broken/circular nested
      # vendored submodules (e.g. ipfs_accelerate_py/ipfs_datasets_py/.tools/...)
      # whose gitlinks point at commits no longer present upstream, which breaks
      # `submodules: recursive` checkout on every runner. The build only needs
      # the top-level module sources, which the staging script then trims.
      - name: Initialize top-level backend submodules
        shell: bash
        run: |
          git submodule update --init --force --depth 1 \
            ipfs_kit_py ipfs_datasets_py ipfs_accelerate_py swissknife || \
            git submodule update --init --force \
              ipfs_kit_py ipfs_datasets_py ipfs_accelerate_py swissknife
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      # Platform-specific system dependencies
      - name: Install RHEL system dependencies
        if: matrix.os == 'rhel'
        run: |
          dnf install -y \
            git \
            curl \
            wget \
            ca-certificates \
            gcc \
            gcc-c++ \
            make \
            libX11-devel \
            libxkbfile-devel \
            libsecret-devel \
            gtk3 \
            libnotify \
            nss \
            libXScrnSaver \
            alsa-lib \
            xorg-x11-server-Xvfb \
            rpm-build \
            rpmdevtools
      
      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libnotify-dev \
            libgconf-2-4 \
            libnss3 \
            libxss1 \
            libasound2 \
            libxtst6 \
            xauth \
            xvfb \
            rpm \
            fakeroot \
            dpkg
      
      - name: Install macOS system dependencies
        if: matrix.os == 'macos'
        run: |
          brew install python@3.12 || true
      
      # Force C++20 for native module (re)builds. Electron 32's headers require
      # C++20 but node-gyp defaults to gnu++17 on Linux/macOS, which breaks the
      # deasync/keytar native rebuild. gyp reads $HOME/.gyp/include.gypi.
      - name: Configure C++20 for node-gyp (non-Windows)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          mkdir -p "$HOME/.gyp"
          cat > "$HOME/.gyp/include.gypi" <<'GYPI'
          {
            'target_defaults': {
              'cflags_cc': ['-std=gnu++20'],
              'cflags_cc!': ['-std=gnu++17', '-std=gnu++14', '-std=gnu++1y'],
              'xcode_settings': {
                'CLANG_CXX_LANGUAGE_STANDARD': 'gnu++20',
              },
            },
          }
          GYPI
          cat "$HOME/.gyp/include.gypi"

      # Install JavaScript dependencies
      - name: Install npm dependencies
        run: |
          npm ci || npm install
      
      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/hallucinate_app/python/requirements.txt || true
        continue-on-error: true
      
      # Install submodule dependencies
      - name: Install submodule dependencies
        shell: bash
        run: |
          bash scripts/install_submodule_deps.sh || true
        continue-on-error: true
      
      # Build the application for specific architecture
      - name: Package application
        run: |
          npm run package -- --arch=${{ matrix.arch }}
        env:
          NODE_ENV: production
      
      # Make distributables
      - name: Make distributables
        run: |
          npm run make -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
        env:
          NODE_ENV: production
      
      # List output directory for debugging
      - name: List output directory
        shell: bash
        run: |
          echo "=== Output directory structure ==="
          ls -laR out/ || echo "No out/ directory found"
      
      # Upload Windows artifacts
      - name: Upload Windows x64 artifacts
        if: matrix.os == 'windows' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload Windows ARM64 artifacts
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            out/make/squirrel.windows/arm64/*.exe
            out/make/squirrel.windows/arm64/*.nupkg
          retention-days: 7
          if-no-files-found: error
      
      # Upload macOS artifacts
      - name: Upload macOS x64 artifacts
        if: matrix.os == 'macos' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            out/make/**/*.dmg
            out/make/zip/darwin/x64/*.zip
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload macOS ARM64 artifacts
        if: matrix.os == 'macos' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            out/make/**/*.dmg
            out/make/zip/darwin/arm64/*.zip
          retention-days: 7
          if-no-files-found: error
      
      # Upload Linux artifacts
      - name: Upload Linux x64 DEB artifacts
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-deb
          path: |
            out/make/deb/x64/*.deb
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload Linux x64 RPM artifacts
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-rpm
          path: |
            out/make/rpm/x64/*.rpm
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload Linux x64 ZIP artifacts
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-zip
          path: |
            out/make/zip/linux/x64/*.zip
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload Linux ARM64 DEB artifacts
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-deb
          path: |
            out/make/deb/arm64/*.deb
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload Linux ARM64 RPM artifacts
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-rpm
          path: |
            out/make/rpm/arm64/*.rpm
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload Linux ARM64 ZIP artifacts
        if: matrix.os == 'linux' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-zip
          path: |
            out/make/zip/linux/arm64/*.zip
          retention-days: 7
          if-no-files-found: error
      
      # Upload RHEL artifacts
      - name: Upload RHEL x64 RPM artifacts
        if: matrix.os == 'rhel' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: rhel-x64-rpm
          path: |
            out/make/rpm/x64/*.rpm
          retention-days: 7
          if-no-files-found: error
      
      - name: Upload RHEL ARM64 RPM artifacts
        if: matrix.os == 'rhel' && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: rhel-arm64-rpm
          path: |
            out/make/rpm/arm64/*.rpm
          retention-days: 7
          if-no-files-found: error

  # Create GitHub Release with all artifacts
  create-release:
    name: Create GitHub Release
    needs: build-release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      
      - name: List all artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -laR release-artifacts/
      
      - name: Generate release notes
        id: release_notes
        run: |
          # Extract version from tag or input
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # Create release notes
          cat > release_notes.md << 'EOF'
          ## Hallucinate App ${VERSION}
          
          ### Downloads
          
          Choose the appropriate package for your platform and architecture:
          
          #### Windows
          - **Windows x64**: `hallucinate_app-${VERSION}-win32-x64-setup.exe`
          - **Windows ARM64**: `hallucinate_app-${VERSION}-win32-arm64-setup.exe`
          
          #### macOS
          - **macOS Intel (x64)**: `hallucinate_app-${VERSION}-darwin-x64.zip`
          - **macOS Apple Silicon (ARM64)**: `hallucinate_app-${VERSION}-darwin-arm64.zip`
          
          #### Linux
          - **Linux x64 DEB**: `hallucinate_app_${VERSION}_amd64.deb`
          - **Linux x64 RPM**: `hallucinate_app-${VERSION}.x86_64.rpm`
          - **Linux x64 ZIP**: `hallucinate_app-${VERSION}-linux-x64.zip`
          - **Linux ARM64 DEB**: `hallucinate_app_${VERSION}_arm64.deb`
          - **Linux ARM64 RPM**: `hallucinate_app-${VERSION}.aarch64.rpm`
          - **Linux ARM64 ZIP**: `hallucinate_app-${VERSION}-linux-arm64.zip`
          
          #### RedHat Enterprise Linux (RHEL)
          - **RHEL x64 RPM**: `hallucinate_app-${VERSION}-rhel.x86_64.rpm`
          - **RHEL ARM64 RPM**: `hallucinate_app-${VERSION}-rhel.aarch64.rpm`
          
          > Note: RHEL RPMs are also compatible with CentOS, Rocky Linux, AlmaLinux, and Fedora
          
          ### Installation
          
          **Windows**: Run the `.exe` installer
          
          **macOS**: 
          1. Download and extract the `.zip` file
          2. Move the app to your Applications folder
          3. Right-click and select "Open" the first time (to bypass Gatekeeper)
          
          **Linux (DEB)**: `sudo dpkg -i hallucinate_app_*.deb`
          
          **Linux (RPM)**: `sudo rpm -i hallucinate_app-*.rpm`
          
          **Linux (ZIP)**: Extract and run the executable
          
          ### What's Changed
          
          EOF
          
          # Add recent commits as changelog if this is a tag push
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "#### Recent Changes" >> release_notes.md
            git log --pretty=format:"- %s (%h)" -10 >> release_notes.md
          fi
          
          cat release_notes.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_notes.outputs.VERSION }}
          name: Release ${{ steps.release_notes.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.nupkg
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Release Summary
        run: |
          echo "# Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Version: ${{ steps.release_notes.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Published Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          cd release-artifacts
          for dir in */; do
            echo "### ${dir%/}" >> $GITHUB_STEP_SUMMARY
            find "$dir" -type f | while read file; do
              size=$(du -h "$file" | cut -f1)
              echo "- $(basename "$file") ($size)" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          done
