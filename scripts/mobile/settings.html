<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backend Settings — Hallucinate App</title>
  <script src="/mobile/mobile_bridge.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff; min-height: 100vh; padding: 24px 16px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p.sub { opacity: .7; font-size: 14px; margin-bottom: 20px; }
    label { display: block; font-size: 13px; margin: 16px 0 6px; opacity: .85; }
    input[type=text] {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.06); color: #fff; font-size: 15px;
    }
    .hint { font-size: 12px; opacity: .55; margin-top: 4px; }
    .row { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
    button {
      flex: 1; min-width: 120px; padding: 12px 16px; border-radius: 8px; border: none;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .save { background: #4CAF50; color: #08210b; }
    .test { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.2); }
    .home { background: transparent; color: #9ad; border: 1px solid rgba(150,200,255,.3); }
    #status { margin-top: 18px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
    #status.ok { display: block; background: rgba(76,175,80,.18); color: #9be29e; }
    #status.err { display: block; background: rgba(244,67,54,.18); color: #f3a39c; }
    .card { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>⚙ Backend Settings</h1>
    <p class="sub">Point the mobile app at a remote MCP++ / IPFS backend. The
      desktop app runs these locally; on mobile they must be reached over the
      network.</p>

    <div class="card">
      <label for="base">REST gateway URL</label>
      <input id="base" type="text" placeholder="https://your-host:8080" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <div class="hint">Serves <code>/v1/ipfs/*</code>. Example: <code>https://backend.example.com:8080</code></div>

      <label for="mcp">MCP++ JSON-RPC URL (optional)</label>
      <input id="mcp" type="text" placeholder="https://your-host:8004 (defaults to REST URL)" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <div class="hint">MCP++ tools endpoint. Leave blank to reuse the REST URL.</div>

      <div class="row">
        <button class="test" id="testBtn">Test connection</button>
        <button class="save" id="saveBtn">Save</button>
      </div>
      <div class="row">
        <button class="home" id="homeBtn">⌂ Back to Home</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script>
    var LS_BASE = 'hallucinateBackendUrl';
    var LS_MCP = 'hallucinateMcpUrl';
    var baseEl = document.getElementById('base');
    var mcpEl = document.getElementById('mcp');
    var statusEl = document.getElementById('status');

    function show(kind, msg) {
      statusEl.className = kind;
      statusEl.textContent = msg;
    }
    function norm(u) { return (u || '').trim().replace(/\/+$/, ''); }

    // Load existing values.
    try {
      baseEl.value = localStorage.getItem(LS_BASE) || '';
      mcpEl.value = localStorage.getItem(LS_MCP) || '';
    } catch (e) {}

    document.getElementById('saveBtn').onclick = function () {
      var base = norm(baseEl.value);
      if (!base) { show('err', 'Enter a REST gateway URL first.'); return; }
      try {
        localStorage.setItem(LS_BASE, base);
        if (norm(mcpEl.value)) localStorage.setItem(LS_MCP, norm(mcpEl.value));
        else localStorage.removeItem(LS_MCP);
        // Keep dashboards' port aligned (host rewrite handled by the bridge).
        localStorage.setItem('handsfreePort', '8080');
      } catch (e) { show('err', 'Could not save: ' + e.message); return; }
      show('ok', 'Saved. Backend = ' + base);
    };

    document.getElementById('testBtn').onclick = async function () {
      var base = norm(baseEl.value);
      if (!base) { show('err', 'Enter a REST gateway URL first.'); return; }
      show('ok', 'Testing ' + base + ' …');
      var endpoints = ['/v1/ipfs/status', '/health', '/v1/ipfs/capabilities'];
      for (var i = 0; i < endpoints.length; i++) {
        try {
          // Use the native fetch with an absolute URL (no bridge rewrite needed).
          var res = await fetch(base + endpoints[i], { method: 'GET' });
          if (res.ok) {
            show('ok', '✓ Connected (' + endpoints[i] + ' → ' + res.status + ').');
            return;
          }
        } catch (e) { /* try next */ }
      }
      show('err', '✗ Could not reach ' + base + '. Check the URL, that the server is running, and that it allows CORS + HTTPS.');
    };

    document.getElementById('homeBtn').onclick = function () {
      window.location.href = '/index.html';
    };
  </script>
</body>
</html>
