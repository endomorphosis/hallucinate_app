global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load alert rules
rule_files:
  - alerts.yml

# Scrape configurations
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "hallucinate_app"
    static_configs:
      - targets: ["host.docker.internal:9090"]
    honor_labels: true
    
  # SDK Generator metrics  
  - job_name: "sdk_generator"
    static_configs:
      - targets: ["host.docker.internal:9090"]
    honor_labels: true
    metrics_path: "/metrics"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: sdk_generator_.*
        action: keep