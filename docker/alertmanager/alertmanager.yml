global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.org:587'
  smtp_from: 'alertmanager@example.org'
  smtp_auth_username: 'alertmanager'
  smtp_auth_password: 'password'

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-notifications'
  routes:
  - match:
      severity: critical
    receiver: 'slack-critical'
    continue: true
  - match:
      severity: warning
    receiver: 'slack-warnings'
    continue: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

receivers:
- name: 'email-notifications'
  email_configs:
  - to: 'alerts@example.org'
    send_resolved: true

- name: 'slack-critical'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/REPLACE_WITH_SLACK_WEBHOOK'
    channel: '#alerts-critical'
    title: '[CRITICAL] {{ .GroupLabels.alertname }}'
    text: "{{ range .Alerts }}*Alert:* {{ .Annotations.summary }}\n*Description:* {{ .Annotations.description }}\n*Details:*\n{{ range .Labels.SortedPairs }} • *{{ .Name }}:* {{ .Value }}\n{{ end }}{{ end }}"
    send_resolved: true

- name: 'slack-warnings'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/REPLACE_WITH_SLACK_WEBHOOK'
    channel: '#alerts-warnings'
    title: '[WARNING] {{ .GroupLabels.alertname }}'
    text: "{{ range .Alerts }}*Alert:* {{ .Annotations.summary }}\n*Description:* {{ .Annotations.description }}\n*Details:*\n{{ range .Labels.SortedPairs }} • *{{ .Name }}:* {{ .Value }}\n{{ end }}{{ end }}"
    send_resolved: true