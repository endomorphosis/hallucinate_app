<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication &amp; Security Dashboard</title>
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  
  <!-- Dashboard CSS -->
  <link rel="stylesheet" href="../dashboard/auth_dashboard.css">
  
  <style>
    /* Page specific styles */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9fafb;
      color: #111827;
      --color-primary: #4a6cf7;
      --color-primary-dark: #3a5cd9;
      --color-success: #10b981;
      --color-success-dark: #0e9f6e;
      --color-warning: #f59e0b;
      --color-warning-dark: #d97706;
      --color-error: #ef4444;
      --color-error-dark: #dc2626;
      --color-surface: #ffffff;
      --color-surface-variant: #f3f4f6;
      --color-border: #e5e7eb;
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --color-text-tertiary: #9ca3af;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111827;
        color: #f9fafb;
        --color-surface: #1f2937;
        --color-surface-variant: #111827;
        --color-border: #374151;
        --color-text-primary: #f9fafb;
        --color-text-secondary: #d1d5db;
        --color-text-tertiary: #9ca3af;
        --color-primary: #5b7cfc;
        --color-primary-dark: #4a6cf7;
        --color-success: #10b981;
        --color-success-dark: #059669;
        --color-warning: #f59e0b;
        --color-warning-dark: #d97706;
        --color-error: #ef4444;
        --color-error-dark: #dc2626;
      }
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      min-height: 100vh;
    }
    
    header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--color-border);
    }
    
    header h1 {
      font-size: 2rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    header h1 i {
      color: var(--color-primary);
    }
    
    header p {
      margin: 0.5rem 0 0;
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        <i class="fas fa-shield-alt"></i>
        Authentication &amp; Security Dashboard
      </h1>
      <p>Manage authentication, security capabilities, and API keys in one place</p>
    </header>
    
    <div id="auth-dashboard-container"></div>
  </div>
  
  <script type="module">
    // Import the AuthDashboard class
    import AuthDashboard from '../dashboard/auth_dashboard.js';
    import { authManager } from '../auth.js';
    import { keystore } from '../keystore.js';
    import { authKeystoreIntegration } from '../auth_keystore_integration.js';
    
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', async () => {
      // Create an event bus for dashboard communication
      const eventBus = {
        listeners: {},
        on(event, callback) {
          if (!this.listeners[event]) {
            this.listeners[event] = [];
          }
          this.listeners[event].push(callback);
        },
        emit(event, data) {
          if (this.listeners[event]) {
            this.listeners[event].forEach(callback => callback(data));
          }
        }
      };
      
      // Initialize authentication components
      await authManager.init();
      await keystore.init();
      await authKeystoreIntegration.init();
      
      // Create the Auth Dashboard
      const authDashboard = new AuthDashboard({
        element: document.getElementById('auth-dashboard-container'),
        auth: authManager,
        keystore: keystore,
        integration: authKeystoreIntegration,
        eventBus: eventBus
      });
      
      // Initialize and render the dashboard
      await authDashboard.init();
      await authDashboard.render();
      
      // Handle custom dashboard events
      eventBus.on('auth-status-change', (status) => {
        console.log('Auth status changed:', status);
      });
      
      eventBus.on('keystore-operation', (op) => {
        console.log('Keystore operation:', op);
      });
      
      // Handle window close
      window.addEventListener('beforeunload', () => {
        // Perform any cleanup if needed
      });
    });
  </script>
</body>
</html>
