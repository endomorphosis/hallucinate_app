<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication &amp; Security Dashboard</title>
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="../../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  
  <!-- Dashboard CSS -->
  <link rel="stylesheet" href="../dashboard/auth_dashboard.css">
  
  <style>
    /* Page specific styles */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9fafb;
      color: #111827;
      --color-primary: #4a6cf7;
      --color-primary-dark: #3a5cd9;
      --color-success: #10b981;
      --color-success-dark: #0e9f6e;
      --color-warning: #f59e0b;
      --color-warning-dark: #d97706;
      --color-error: #ef4444;
      --color-error-dark: #dc2626;
      --color-surface: #ffffff;
      --color-surface-variant: #f3f4f6;
      --color-border: #e5e7eb;
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --color-text-tertiary: #9ca3af;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111827;
        color: #f9fafb;
        --color-surface: #1f2937;
        --color-surface-variant: #111827;
        --color-border: #374151;
        --color-text-primary: #f9fafb;
        --color-text-secondary: #d1d5db;
        --color-text-tertiary: #9ca3af;
        --color-primary: #5b7cfc;
        --color-primary-dark: #4a6cf7;
        --color-success: #10b981;
        --color-success-dark: #059669;
        --color-warning: #f59e0b;
        --color-warning-dark: #d97706;
        --color-error: #ef4444;
        --color-error-dark: #dc2626;
      }
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      min-height: 100vh;
    }
    
    header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--color-border);
    }
    
    header h1 {
      font-size: 2rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    header h1 i {
      color: var(--color-primary);
    }
    
    header p {
      margin: 0.5rem 0 0;
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <button type="button" data-testid="nav-home" aria-label="Back to Main Dashboard" title="Back to Main Dashboard" onclick="window.electronAPI?.navigation?.navigateHome?.()" style="position:fixed;bottom:16px;left:16px;z-index:99999;padding:8px 14px;background:#2d3748;color:#fff;border:none;border-radius:20px;cursor:pointer;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.25);">🏠 Home</button>
  <div class="container" role="main">
    <header>
      <h1>
        <i class="fas fa-shield-alt"></i>
        Authentication &amp; Security Dashboard
      </h1>
      <p>Manage authentication, security capabilities, and API keys in one place</p>
    </header>
    
    <div id="auth-dashboard-container"></div>
  </div>
  
  <script type="module">
    // Import the AuthDashboard class
    import AuthDashboard from '../dashboard/auth_dashboard.js';
    import { authManager } from '../auth.js';
    import { keystore } from '../keystore.js';
    import { authKeystoreIntegration } from '../auth_keystore_integration.js';
    
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', async () => {
      // Create an event bus for dashboard communication
      const eventBus = {
        listeners: {},
        on(event, callback) {
          if (!this.listeners[event]) {
            this.listeners[event] = [];
          }
          this.listeners[event].push(callback);
        },
        emit(event, data) {
          if (this.listeners[event]) {
            this.listeners[event].forEach(callback => callback(data));
          }
        }
      };
      
      // Initialize authentication components
      await authManager.init();
      await keystore.init();
      await authKeystoreIntegration.init();
      
      // Create the Auth Dashboard
      const authDashboard = new AuthDashboard({
        element: document.getElementById('auth-dashboard-container'),
        auth: authManager,
        keystore: keystore,
        integration: authKeystoreIntegration,
        eventBus: eventBus
      });
      
      // Initialize and render the dashboard
      await authDashboard.init();
      await authDashboard.render();
      
      // --- IPFS UCAN Delegation (MCP++ Profile C) ---
      const ucanSection = document.createElement('div');
      ucanSection.id = 'ucan-delegation-section';
      ucanSection.innerHTML = `
        <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:0.5rem;padding:1.5rem;margin-top:2rem;">
          <h2 style="margin:0 0 1rem;font-size:1.25rem;">
            <i class="fas fa-key" style="color:var(--color-primary);"></i>
            IPFS UCAN Delegation (MCP++ Profile C)
          </h2>
          <p style="color:var(--color-text-secondary);margin:0 0 1rem;">
            Verify UCAN (User Controlled Authorization Networks) delegation chain for IPFS backend services.
          </p>
          <div id="ucan-status" style="margin-bottom:1rem;">
            <span style="color:var(--color-text-tertiary);">Not checked yet</span>
          </div>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
            <button id="btn-check-ucan" style="background:var(--color-primary);color:#fff;border:none;padding:0.5rem 1rem;border-radius:0.25rem;cursor:pointer;">
              Check UCAN Status
            </button>
            <button id="btn-generate-ucan" style="background:var(--color-success);color:#fff;border:none;padding:0.5rem 1rem;border-radius:0.25rem;cursor:pointer;">
              Generate Delegation Token
            </button>
            <button id="btn-revoke-ucan" style="background:var(--color-error);color:#fff;border:none;padding:0.5rem 1rem;border-radius:0.25rem;cursor:pointer;">
              Revoke Delegation
            </button>
          </div>
          <div id="ucan-details" style="margin-top:1rem;font-family:monospace;font-size:0.8rem;background:var(--color-surface-variant);padding:1rem;border-radius:0.25rem;display:none;overflow-x:auto;"></div>
        </div>
      `;
      document.querySelector('.container').appendChild(ucanSection);

      const ucanStatus = document.getElementById('ucan-status');
      const ucanDetails = document.getElementById('ucan-details');
      const BACKEND_PORT = localStorage.getItem('handsfreePort') || '8080';

      document.getElementById('btn-check-ucan').addEventListener('click', async () => {
        ucanStatus.innerHTML = '<span style="color:var(--color-warning);">Checking...</span>';
        try {
          const res = await fetch(\`http://localhost:\${BACKEND_PORT}/v1/ipfs/status\`);
          const data = await res.json();
          const mcpppProfiles = data.mcp_plus_plus_profiles || {};
          const ucanProfile = mcpppProfiles.ucan_delegation || { supported: false };
          if (ucanProfile.supported) {
            ucanStatus.innerHTML = '<span style="color:var(--color-success);"><i class="fas fa-check-circle"></i> UCAN Profile C active</span>';
            ucanDetails.style.display = 'block';
            ucanDetails.textContent = JSON.stringify(ucanProfile, null, 2);
          } else {
            ucanStatus.innerHTML = '<span style="color:var(--color-warning);"><i class="fas fa-exclamation-triangle"></i> UCAN not negotiated</span>';
            ucanDetails.style.display = 'block';
            ucanDetails.textContent = JSON.stringify(data, null, 2);
          }
        } catch (e) {
          ucanStatus.innerHTML = \`<span style="color:var(--color-error);"><i class="fas fa-times-circle"></i> Backend unreachable: \${e.message}</span>\`;
        }
      });

      document.getElementById('btn-generate-ucan').addEventListener('click', async () => {
        try {
          const res = await fetch(\`http://localhost:\${BACKEND_PORT}/v1/ipfs/status\`);
          const data = await res.json();
          // Simulate UCAN token generation using keystore DID
          const did = await keystore.getDID?.() || 'did:key:placeholder';
          const token = { iss: did, aud: 'did:ipfs:backend', att: [{ with: 'ipfs://*', can: '*' }], exp: Math.floor(Date.now()/1000) + 3600, prf: [] };
          ucanDetails.style.display = 'block';
          ucanDetails.textContent = 'Generated UCAN delegation token:\\n' + JSON.stringify(token, null, 2);
          ucanStatus.innerHTML = '<span style="color:var(--color-success);"><i class="fas fa-check-circle"></i> Token generated</span>';
        } catch (e) {
          ucanStatus.innerHTML = \`<span style="color:var(--color-error);">Error: \${e.message}</span>\`;
        }
      });

      document.getElementById('btn-revoke-ucan').addEventListener('click', () => {
        ucanDetails.style.display = 'block';
        ucanDetails.textContent = 'UCAN delegation revoked. Token is no longer valid.';
        ucanStatus.innerHTML = '<span style="color:var(--color-text-tertiary);"><i class="fas fa-ban"></i> Delegation revoked</span>';
      });
      
      // Handle custom dashboard events
      eventBus.on('auth-status-change', (status) => {
        console.log('Auth status changed:', status);
      });
      
      eventBus.on('keystore-operation', (op) => {
        console.log('Keystore operation:', op);
      });
      
      // Handle window close
      window.addEventListener('beforeunload', () => {
        // Perform any cleanup if needed
      });
    });
  </script>
</body>
</html>
