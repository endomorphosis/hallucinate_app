<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Daemon Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .controls {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .btn {
      padding: 12px 24px;
      background: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    .btn.start {
      background: #48bb78;
      color: white;
    }

    .btn.stop {
      background: #f56565;
      color: white;
    }

    .btn.refresh {
      background: #4299e1;
      color: white;
    }

    .daemon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .daemon-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .daemon-card:hover {
      transform: translateY(-5px);
    }

    .daemon-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .daemon-name {
      font-size: 1.3em;
      font-weight: 700;
      color: #2d3748;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-running {
      background: #c6f6d5;
      color: #22543d;
    }

    .status-stopped {
      background: #fed7d7;
      color: #742a2a;
    }

    .status-starting {
      background: #feebc8;
      color: #7c2d12;
    }

    .status-failed {
      background: #feb2b2;
      color: #63171b;
    }

    .capability-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .capability-available {
      background: #c6f6d5;
      color: #22543d;
    }

    .capability-degraded {
      background: #feebc8;
      color: #7c2d12;
    }

    .capability-unavailable,
    .capability-error {
      background: #fed7d7;
      color: #742a2a;
    }

    .capability-unknown,
    .capability-na {
      background: #e2e8f0;
      color: #4a5568;
    }

    .daemon-info {
      margin: 15px 0;
      color: #4a5568;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .info-label {
      font-weight: 600;
      color: #2d3748;
    }

    .daemon-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .daemon-btn {
      flex: 1;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .daemon-btn.start {
      background: #48bb78;
      color: white;
    }

    .daemon-btn.stop {
      background: #f56565;
      color: white;
    }

    .daemon-btn.restart {
      background: #ed8936;
      color: white;
    }

    .daemon-btn:hover {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .daemon-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .event-log {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-height: 400px;
      overflow-y: auto;
    }

    .event-log h2 {
      margin-bottom: 15px;
      color: #2d3748;
    }

    .event-item {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      background: #f7fafc;
      border-left: 4px solid #667eea;
      font-size: 0.9em;
    }

    .event-time {
      color: #718096;
      font-size: 0.85em;
    }

    .event-error {
      border-left-color: #f56565;
      background: #fff5f5;
    }

    .event-success {
      border-left-color: #48bb78;
      background: #f0fff4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 MCP Daemon Manager</h1>
    
    <div class="controls">
      <button class="btn start" onclick="startAll()">Start All Daemons</button>
      <button class="btn stop" onclick="stopAll()">Stop All Daemons</button>
      <button class="btn refresh" onclick="refreshStatus()">Refresh Status</button>
    </div>

    <div class="daemon-grid" id="daemonGrid">
      <!-- Daemon cards will be inserted here -->
    </div>

    <div class="event-log">
      <h2>Event Log</h2>
      <div id="eventLog">
        <div class="event-item">
          <span class="event-time">${new Date().toLocaleTimeString()}</span> - 
          Daemon Manager initialized
        </div>
      </div>
    </div>
  </div>

  <script>
    const daemonApi = window?.electronAPI?.daemon;
    if (!daemonApi) {
      console.error('Daemon API bridge is unavailable.');
    }

    // Update daemon display
    function updateDaemons(status) {
      const grid = document.getElementById('daemonGrid');
      grid.innerHTML = '';

      for (const [daemonId, info] of Object.entries(status)) {
        const card = createDaemonCard(daemonId, info);
        grid.appendChild(card);
      }
    }

    // Create daemon card
    function createDaemonCard(daemonId, info) {
      const card = document.createElement('div');
      card.className = 'daemon-card';
      
      const statusClass = `status-${info.status}`;
      const uptime = info.uptime ? formatUptime(info.uptime) : 'N/A';
      const healthLabel = info?.lastHealth?.healthy ? 'healthy' : 'degraded';
      const endpoint = info?.endpoint || `http://127.0.0.1:${info.port}`;
      const mcpPlusPlus = info?.mcpPlusPlus || null;
      const mcpState = mcpPlusPlus
        ? (mcpPlusPlus.state || (mcpPlusPlus.available ? 'available' : 'degraded'))
        : 'n/a';
      const mcpMode = mcpPlusPlus?.mode || 'n/a';
      const mcpProfile = mcpPlusPlus?.active_profile || 'n/a';
      const mcpNegotiation = mcpPlusPlus
        ? (mcpPlusPlus.supports_profile_negotiation ? 'yes' : 'no')
        : 'n/a';
      const mcpStateClass = `capability-${String(mcpState).toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
      
      card.innerHTML = `
        <div class="daemon-header">
          <div class="daemon-name">${info?.name || formatDaemonName(daemonId)}</div>
          <div class="status-badge ${statusClass}">${info.status}</div>
        </div>
        <div class="daemon-info">
          <div class="info-row">
            <span class="info-label">PID:</span>
            <span>${info.pid || 'N/A'}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Uptime:</span>
            <span>${uptime}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Restarts:</span>
            <span>${info.restartCount}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Port:</span>
            <span>${info.port}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Health:</span>
            <span>${healthLabel}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Endpoint:</span>
            <span>${endpoint}</span>
          </div>
          <div class="info-row">
            <span class="info-label">MCP++ State:</span>
            <span class="capability-badge ${mcpStateClass}">${mcpState}</span>
          </div>
          <div class="info-row">
            <span class="info-label">MCP++ Mode:</span>
            <span>${mcpMode}</span>
          </div>
          <div class="info-row">
            <span class="info-label">MCP++ Profile:</span>
            <span>${mcpProfile}</span>
          </div>
          <div class="info-row">
            <span class="info-label">MCP++ Negotiation:</span>
            <span>${mcpNegotiation}</span>
          </div>
        </div>
        <div class="daemon-actions">
          <button class="daemon-btn start" onclick="startDaemon('${daemonId}')" 
                  ${info.status === 'running' ? 'disabled' : ''}>
            Start
          </button>
          <button class="daemon-btn stop" onclick="stopDaemon('${daemonId}')"
                  ${info.status === 'stopped' ? 'disabled' : ''}>
            Stop
          </button>
          <button class="daemon-btn restart" onclick="restartDaemon('${daemonId}')"
                  ${info.status === 'stopped' ? 'disabled' : ''}>
            Restart
          </button>
        </div>
      `;
      
      return card;
    }

    // Format daemon name for display
    function formatDaemonName(name) {
      return name
        .split('-')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ');
    }

    // Format uptime
    function formatUptime(ms) {
      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      
      if (hours > 0) {
        return `${hours}h ${minutes % 60}m`;
      } else if (minutes > 0) {
        return `${minutes}m ${seconds % 60}s`;
      } else {
        return `${seconds}s`;
      }
    }

    // Add event to log
    function addEvent(message, type = 'info') {
      const log = document.getElementById('eventLog');
      const event = document.createElement('div');
      event.className = `event-item ${type === 'error' ? 'event-error' : type === 'success' ? 'event-success' : ''}`;
      event.innerHTML = `
        <span class="event-time">${new Date().toLocaleTimeString()}</span> - 
        ${message}
      `;
      log.insertBefore(event, log.firstChild);
      
      // Keep only last 50 events
      while (log.children.length > 50) {
        log.removeChild(log.lastChild);
      }
    }

    // Daemon control functions
    async function startAll() {
      try {
        await daemonApi.startAll();
        await refreshStatus();
        addEvent('All daemons started', 'success');
      } catch (error) {
        addEvent(`Error starting daemons: ${error.message}`, 'error');
      }
    }

    async function stopAll() {
      try {
        await daemonApi.stopAll();
        await refreshStatus();
        addEvent('All daemons stopped', 'success');
      } catch (error) {
        addEvent(`Error stopping daemons: ${error.message}`, 'error');
      }
    }

    async function startDaemon(name) {
      try {
        await daemonApi.start(name);
        await refreshStatus();
        addEvent(`Started ${formatDaemonName(name)}`, 'success');
      } catch (error) {
        addEvent(`Error starting ${formatDaemonName(name)}: ${error.message}`, 'error');
      }
    }

    async function stopDaemon(name) {
      try {
        await daemonApi.stop(name);
        await refreshStatus();
        addEvent(`Stopped ${formatDaemonName(name)}`, 'success');
      } catch (error) {
        addEvent(`Error stopping ${formatDaemonName(name)}: ${error.message}`, 'error');
      }
    }

    async function restartDaemon(name) {
      try {
        await daemonApi.restart(name);
        await refreshStatus();
        addEvent(`Restarted ${formatDaemonName(name)}`, 'success');
      } catch (error) {
        addEvent(`Error restarting ${formatDaemonName(name)}: ${error.message}`, 'error');
      }
    }

    async function refreshStatus() {
      try {
        const status = await daemonApi.getAll();
        updateDaemons(status);
      } catch (error) {
        addEvent(`Error refreshing status: ${error.message}`, 'error');
      }
    }

    async function addMcpPlusPlusEvent(daemonId, eventType = 'info') {
      try {
        const status = await daemonApi.getAll();
        const daemonStatus = status?.[daemonId];
        const capability = daemonStatus?.mcpPlusPlus;
        if (!capability) {
          return;
        }

        const mode = capability.mode || 'unknown';
        const state = capability.state || (capability.available ? 'available' : 'degraded');
        const profile = capability.active_profile || 'none';
        addEvent(`${formatDaemonName(daemonId)} MCP++ ${state} (${mode}, profile: ${profile})`, eventType);
      } catch {
        // Ignore MCP++ telemetry lookup failures in the event log path.
      }
    }

    // Listen for daemon events
    const detachDaemonListener = daemonApi?.onEvent?.(({ type, data }) => {
      const name = formatDaemonName(data?.daemon || data?.name || 'daemon');
      
      switch (type) {
        case 'started':
          addEvent(`${name} started`, 'success');
          if (data?.daemon) {
            addMcpPlusPlusEvent(data.daemon, 'info');
          }
          break;
        case 'stopped':
          addEvent(`${name} stopped`, 'info');
          break;
        case 'all-started':
          addEvent('All MCP daemons are running', 'success');
          break;
        case 'all-stopped':
          addEvent('All MCP daemons are stopped', 'info');
          break;
        case 'error':
          addEvent(`${name} error: ${data?.error || 'Unknown error'}`, 'error');
          break;
        case 'health-check':
          if (data?.healthy === false) {
            addEvent(`${name} health check degraded`, 'error');
            if (data?.daemon) {
              addMcpPlusPlusEvent(data.daemon, 'error');
            }
          }
          break;
      }
      
      // Refresh status after any event
      refreshStatus();
    });

    // Initial status load
    refreshStatus();
    
    // Auto-refresh every 10 seconds
    setInterval(refreshStatus, 10000);

    window.addEventListener('beforeunload', () => {
      if (typeof detachDaemonListener === 'function') {
        detachDaemonListener();
      }
    });
  </script>
</body>
</html>
