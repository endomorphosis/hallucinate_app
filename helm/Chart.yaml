apiVersion: v2
name: hallucinate-app
description: IPFS Bridge application with Grafana and Prometheus integration
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: prometheus
    version: ~15.10.1
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  
  - name: grafana
    version: ~6.50.1
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled