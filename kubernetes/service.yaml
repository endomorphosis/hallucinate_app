apiVersion: v1
kind: Service
metadata:
  name: hallucinate-app
  namespace: hallucinate-app
  labels:
    app: hallucinate-app
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: hallucinate-app